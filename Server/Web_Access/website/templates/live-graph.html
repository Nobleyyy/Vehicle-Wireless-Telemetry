{% extends "base.html" %}

{% block title %}Live Graphs{% endblock %}

{% block content %}

<!-- Main heading shown at the top of the live graph data page -->
<h1>Live Graph Data Page</h1>

<!--
    This div is used to display the most recent vehicle data status
    received from the Flask server.
-->
<div id="vehicle-data">
    Waiting for data...
</div>

<!--
    Graph controls are hidden initially.
    They become visible once numeric data is received.
-->
<div id="graph-controls" style="margin-top: 20px; display: none;">

    <div>
        <strong style="font-size: 20px;">Graph data:</strong>
    </div>

    <!--
        Active Graphs counter, Unshow All button with rounded corners, and Show points toggle in line.
    -->
    <div style="margin-top: 8px; margin-bottom: 15px; display: flex; align-items: baseline;">
        <span id="active-graphs-counter" style="font-weight: normal; font-size: 14px; margin-right: 20px;">Active Graphs (0/20)</span>
        <button id="unshow-all-btn" style="margin-right: 25px; cursor: pointer; padding: 3px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #ccc; background-color: #f8f9fa; color: #333;">Unshow All</button>
        <label style="display: inline-flex; align-items: center; cursor: pointer;">
            <input
                type="checkbox"
                id="points-toggle"
                checked
                style="margin-right: 4px;"
            >
            Show points
        </label>
    </div>

    <!--
        JavaScript dynamically adds categorized groups and checkboxes here.
    -->
    <div id="graph-options" style="margin-top: 8px;">
    </div>

</div>

<!--
    Graphs are dynamically created and inserted into this div.
-->
<div id="graphs" style="margin-top: 20px;">
</div>

<!--
    Load Chart.js from the jsDelivr CDN.
    Chart.js is used to create and display the line graphs.
-->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

// ========================================
// Elements
// ========================================

// Get the HTML element containing the graph controls.
const graphControls =
    document.getElementById("graph-controls");

// Get the container where graph field checkboxes will be added.
const graphOptions =
    document.getElementById("graph-options");

// Get the checkbox used to show or hide graph points.
const pointsToggle =
    document.getElementById("points-toggle");

// Get the active graphs counter element.
const activeGraphsCounter =
    document.getElementById("active-graphs-counter");

// Get the Unshow All button element.
const unshowAllBtn =
    document.getElementById("unshow-all-btn");

// Get the container where the actual graphs will be displayed.
const graphsContainer =
    document.getElementById("graphs");

// Get the element used to display status/waiting messages.
const vehicleData =
    document.getElementById("vehicle-data");


// ========================================
// Data storage
// ========================================

// Store all received vehicle records in an array.
const records = [];

// Store each Chart.js graph using its field name as the key.
const charts = {};


// ========================================
// Graph colours
// ========================================

// List of colours used for the different graphs.
const graphColors = [
    "#007bff",
    "#dc3545",
    "#28a745",
    "#ffc107",
    "#6f42c1",
    "#fd7e14",
    "#20c997",
    "#e83e8c",
    "#17a2b8",
    "#6610f2"
];

// Store which colour has been assigned to each graph field.
const graphColorMap = {};


// ========================================
// Get graph colour
// ========================================

function getGraphColor(key) {

    // If this field does not already have a colour,
    // assign it one from the colour list.
    if (!graphColorMap[key]) {

        // Count how many colours have already been assigned.
        const index =
            Object.keys(graphColorMap).length;

        // Assign a colour to this graph field.
        // The modulo operator allows the colours to repeat
        // if there are more graphs than colours.
        graphColorMap[key] =
            graphColors[
                index % graphColors.length
            ];
    }

    // Return the colour assigned to this field.
    return graphColorMap[key];
}


// ========================================
// Get numeric value
// ========================================

function getNumericValue(value) {

    // Return null when there is no usable value.
    if (
        value === null ||
        value === "" ||
        value === undefined ||
        typeof value === "boolean"
    ) {
        return null;
    }

    if (typeof value === "string") {
        const trimmed = value.trim().toLowerCase();
        if (trimmed === "on" || trimmed === "off" || trimmed === "true" || trimmed === "false" || isNaN(Number(trimmed))) {
            return null;
        }
    }

    // Convert the value into a JavaScript number.
    const number = Number(value);

    // If the conversion did not produce a valid number,
    // return null instead.
    if (!Number.isFinite(number)) {
        return null;
    }

    // Return the valid numeric value.
    return number;
}


// ========================================
// Format time
// ========================================

function formatTime(timestamp) {

    // Return an empty string if no timestamp was provided.
    if (!timestamp) {
        return "";
    }

    // Convert the timestamp into a JavaScript Date object.
    const date = new Date(timestamp);

    // Check whether the date is valid.
    if (!Number.isFinite(date.getTime())) {
        return "";
    }

    // Convert the date into a readable time such as:
    // 17:34:25
    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );
}


// ========================================
// Apply point visibility
// ========================================

function applyPointVisibility(chart) {

    // Check whether the "Show points" checkbox is selected.
    const showPoints = pointsToggle.checked;

    // Get the first dataset used by the graph.
    const dataset = chart.data.datasets[0];

    // Show small points when enabled, otherwise hide them.
    dataset.pointRadius = showPoints ? 2 : 0;

    // Make the point slightly larger when the mouse hovers over it.
    dataset.pointHoverRadius = showPoints ? 4 : 0;

    // Disable the invisible hit area when points are hidden.
    dataset.pointHitRadius = 0;

}


// ========================================
// Categorize Graph Fields
// ========================================

function getCategoryForKey(key) {
    const lower = key.toLowerCase();
    if (
        lower.includes("rpm") ||
        lower.includes("temp") ||
        lower.includes("oil") ||
        lower.includes("coolant") ||
        lower.includes("fuel") ||
        lower.includes("boost") ||
        lower.includes("throttle") ||
        lower.includes("pressure") ||
        lower.includes("turbo") ||
        lower.includes("lambda") ||
        lower.includes("afr") ||
        lower.includes("clutch")
    ) {
        return "Engine";
    } else if (
        lower.includes("gear") ||
        lower.includes("paddle") ||
        lower.includes("shift")
    ) {
        return "Gearing";
    } else if (
        lower.includes("speed") ||
        lower.includes("brake") ||
        lower.includes("steering") ||
        lower.includes("accel") ||
        lower.includes("velocity") ||
        lower.includes("lat") ||
        lower.includes("lon")
    ) {
        return "Vehicle";
    } else if (
        lower.includes("volt") ||
        lower.includes("battery") ||
        lower.includes("current") ||
        lower.includes("power") ||
        lower.includes("pdu")
    ) {
        return "Electrical";
    } else {
        return "Other";
    }
}

// Predefined fixed order of categories (Electrical placed before Other)
const categoryOrder = ["Engine", "Vehicle", "Electrical", "Gearing", "Other"];

// ========================================
// Update Active Graphs Counter
// ========================================

function updateActiveGraphsCounter() {
    const checkedCount = graphOptions.querySelectorAll("input[id^='graph-option-']:checked").length;
    if (activeGraphsCounter) {
        activeGraphsCounter.textContent = `Active Graphs (${checkedCount}/20)`;
    }
}


// ========================================
// Unshow All Button Listener
// ========================================

unshowAllBtn.addEventListener("click", function() {
    const allCheckboxes = graphOptions.querySelectorAll("input[id^='graph-option-']");
    allCheckboxes.forEach(cb => {
        cb.checked = false;
    });

    // Also uncheck all group toggle checkboxes
    categoryOrder.forEach(cat => {
        const groupToggle = document.getElementById("group-toggle-" + cat.toLowerCase());
        if (groupToggle) {
            groupToggle.checked = false;
        }
    });

    updateGraphs();
    updateActiveGraphsCounter();
});


// ========================================
// Add graph checkbox
// ========================================

function addGraphOption(key) {

    // Hard block any field named "on", "off", "id", or "status"
    const lowerKey = key.toLowerCase();
    if (lowerKey === "on" || lowerKey === "off" || key === "id" || lowerKey === "status") {
        if (charts[key]) {
            removeGraph(key);
        }
        return;
    }

    // Check whether a checkbox for this field already exists.
    if (
        document.getElementById(
            "graph-option-" + key
        )
    ) {
        return;
    }

    // Determine category and container
    const category = getCategoryForKey(key);
    const catId = category.toLowerCase();
    let groupContainer = document.getElementById("group-container-" + catId);
    let groupWrapper = document.getElementById("group-wrapper-" + catId);

    if (!groupContainer) {
        groupWrapper = document.createElement("div");
        groupWrapper.id = "group-wrapper-" + catId;
        groupWrapper.style.marginBottom = "15px";

        // Group Title & Inline Show Group toggle layout with baseline alignment
        const groupHeader = document.createElement("div");
        groupHeader.style.display = "flex";
        groupHeader.style.alignItems = "baseline";
        groupHeader.style.marginBottom = "5px";

        const groupTitle = document.createElement("span");
        groupTitle.innerHTML = `<strong>${category}</strong>`;
        groupTitle.style.fontSize = "14px";
        groupTitle.style.textTransform = "uppercase";
        groupTitle.style.color = "inherit";
        groupTitle.style.marginRight = "15px";

        const groupToggleLabel = document.createElement("label");
        groupToggleLabel.style.fontSize = "13px";
        groupToggleLabel.style.cursor = "pointer";
        groupToggleLabel.style.display = "inline-flex";
        groupToggleLabel.style.alignItems = "center";

        const groupToggleCheckbox = document.createElement("input");
        groupToggleCheckbox.type = "checkbox";
        groupToggleCheckbox.id = "group-toggle-" + catId;
        groupToggleCheckbox.style.marginRight = "4px";

        groupToggleLabel.appendChild(groupToggleCheckbox);
        groupToggleLabel.appendChild(document.createTextNode("Show Group"));

        groupHeader.appendChild(groupTitle);
        groupHeader.appendChild(groupToggleLabel);
        groupWrapper.appendChild(groupHeader);

        groupContainer = document.createElement("div");
        groupContainer.id = "group-container-" + catId;
        groupContainer.style.marginLeft = "10px";
        groupWrapper.appendChild(groupContainer);

        // Insert wrapper in correct sorted order based on categoryOrder
        const existingWrappers = graphOptions.children;
        let inserted = false;
        const targetIndex = categoryOrder.indexOf(category);

        for (let i = 0; i < existingWrappers.length; i++) {
            const currentCatId = existingWrappers[i].id.replace("group-wrapper-", "");
            const currentCatName = currentCatId.charAt(0).toUpperCase() + currentCatId.slice(1);
            if (categoryOrder.indexOf(currentCatName) > targetIndex) {
                graphOptions.insertBefore(groupWrapper, existingWrappers[i]);
                inserted = true;
                break;
            }
        }

        if (!inserted) {
            graphOptions.appendChild(groupWrapper);
        }

        // Event listener for the group's "Show Group" toggle with debounce/lock to prevent freezing
        let isToggling = false;
        groupToggleCheckbox.addEventListener("change", function() {
            if (isToggling) return;
            isToggling = true;

            const checkboxesInGroup = Array.from(groupContainer.querySelectorAll("input[id^='graph-option-']"));
            
            if (this.checked) {
                const checkedOutsideGroup = Array.from(graphOptions.querySelectorAll("input[id^='graph-option-']:checked"))
                    .filter(cb => !checkboxesInGroup.includes(cb)).length;
                
                const allowedForThisGroup = 20 - checkedOutsideGroup;

                if (allowedForThisGroup <= 0) {
                    alert("Maximum limit of 20 graphs already reached.");
                    this.checked = false;
                    updateGroupToggleState(catId);
                    isToggling = false;
                    return;
                }

                if (checkboxesInGroup.length > allowedForThisGroup) {
                    alert(`Group has more than available slots. Selecting the first ${allowedForThisGroup} to reach the 20 graph limit.`);
                }

                checkboxesInGroup.forEach(cb => cb.checked = false);

                checkboxesInGroup.forEach((cb, index) => {
                    if (index < allowedForThisGroup) {
                        cb.checked = true;
                    }
                });
            } else {
                checkboxesInGroup.forEach(cb => {
                    cb.checked = false;
                });
            }

            updateGraphs();
            updateGroupToggleState(catId);
            updateActiveGraphsCounter();

            setTimeout(() => {
                isToggling = false;
            }, 100);
        });
    }

    // Create a wrapper container for the checkbox and label to keep them together on line wraps
    const itemWrapper = document.createElement("span");
    itemWrapper.style.display = "inline-block";
    itemWrapper.style.marginRight = "15px";
    itemWrapper.style.whiteSpace = "nowrap";

    // Create a new checkbox input element.
    const checkbox =
        document.createElement("input");

    checkbox.type = "checkbox";
    checkbox.id = "graph-option-" + key;
    checkbox.value = key;
    checkbox.className = "group-cb-" + catId;

    // Create a label for the checkbox.
    const label =
        document.createElement("label");

    label.htmlFor = checkbox.id;
    label.textContent = key;
    label.style.marginLeft = "5px";
    label.style.display = "inline-block";
    label.style.color = getGraphColor(key);

    itemWrapper.appendChild(checkbox);
    itemWrapper.appendChild(label);

    // Add item wrapper to the specific category container
    groupContainer.appendChild(itemWrapper);

    // Ensure category wrapper is visible now that it has at least one option
    if (groupWrapper) {
        groupWrapper.style.display = "block";
    }

    // When the checkbox changes, update the graphs.
    checkbox.addEventListener(
        "change",
        function() {

            // Enforce maximum of 20 checked options at once
            const checkedBoxes = graphOptions.querySelectorAll("input[id^='graph-option-']:checked");
            if (checkedBoxes.length > 20) {
                this.checked = false;
                alert("You can select a maximum of 20 graphs at the same time.");
            }

            // Create/remove graphs based on the selected options.
            updateGraphs();

            // Update individual group toggle state
            updateGroupToggleState(catId);

            // Update active graphs counter
            updateActiveGraphsCounter();

        }
    );

    // Make the graph controls visible now that
    // there is at least one graphable field.
    graphControls.style.display =
        "block";
}


// ========================================
// Update Group Toggle State
// ========================================

function updateGroupToggleState(catId) {
    const groupContainer = document.getElementById("group-container-" + catId);
    const groupToggle = document.getElementById("group-toggle-" + catId);
    if (!groupContainer || !groupToggle) return;

    const checkboxes = Array.from(groupContainer.querySelectorAll("input[id^='graph-option-']"));
    if (checkboxes.length === 0) {
        groupToggle.checked = false;
        return;
    }

    groupToggle.checked = checkboxes.every(cb => cb.checked);
}


// ========================================
// Create graph
// ========================================

function createGraph(key) {

    const lowerKey = key.toLowerCase();
    if (lowerKey === "on" || lowerKey === "off" || key === "id" || lowerKey === "status") {
        return;
    }

    // If the graph already exists, do not create another one.
    if (charts[key]) {
        return;
    }


    // Create a wrapper div to hold the graph title and canvas.
    const wrapper =
        document.createElement("div");

    // Make the graph use the full available width.
    wrapper.style.width = "100%";

    // Set the height of the graph.
    wrapper.style.height = "300px";

    // Add space underneath each graph.
    wrapper.style.marginBottom = "30px";


    // Create a heading for the graph.
    const title =
        document.createElement("h3");

    // Use the field name as the graph title.
    title.textContent = key;

    // Give the title the same colour as the graph.
    title.style.color =
        getGraphColor(key);


    // Create the canvas element that Chart.js will draw on.
    const canvas =
        document.createElement("canvas");


    // Add the title to the wrapper.
    wrapper.appendChild(title);

    // Add the canvas to the wrapper.
    wrapper.appendChild(canvas);

    // Add the complete wrapper to the graphs container.
    graphsContainer.appendChild(wrapper);


    // Create labels using all currently stored timestamps.
    const initialLabels =
        records.map(
            record =>
                formatTime(
                    record.timestamp
                )
        );


    // Create graph values using the selected field.
    const initialValues =
        records.map(
            record =>
                getNumericValue(
                    record[key]
                )
        );


    // Create a new Chart.js line graph.
    charts[key] =
        new Chart(
            canvas,
            {
                type: "line",

                data: {

                    // Use the timestamps as the x-axis labels.
                    labels:
                        initialLabels,

                    // Create the graph dataset.
                    datasets: [{

                        // Name of the dataset.
                        label: key,

                        // Values displayed on the graph.
                        data: initialValues,

                        // Colour of the graph line.
                        borderColor: getGraphColor(key),

                        // Colour used for the graph background/points.
                        backgroundColor: getGraphColor(key),

                        // Thickness of the graph line.
                        borderWidth: 2,

                        // Show or hide points depending on the checkbox.
                        pointRadius: pointsToggle.checked ? 2 : 0,

                        // Size of the point when hovered over.
                        pointHoverRadius: pointsToggle.checked ? 4 : 0,

                        // Do not create an additional hit area.
                        pointHitRadius: 0,

                        // Keep the line straight instead of curved.
                        tension: 0

                    }]
                },

                options: {

                    // Allow the graph to resize with the page.
                    responsive: true,

                    // Use the wrapper's height instead of
                    // maintaining Chart.js' default aspect ratio.
                    maintainAspectRatio: false,

                    // Disable animations so live updates happen immediately.
                    animation: false,

                    // Disable hover animation.
                    hover: {
                        animationDuration: 0
                    },

                    plugins: {

                        // Hide the Chart.js legend because
                        // the graph already has a title.
                        legend: {
                            display: false
                        }
                    },

                    elements: {

                        // Keep the graph line straight.
                        line: {
                            tension: 0
                        },
                    },


                    scales: {

                        // Configure the x-axis.
                        x: {

                            // Give the x-axis a title.
                            title: {
                                display: true,
                                text: "Time"
                            }

                        },

                        // Configure the y-axis.
                        y: {

                            // Use the field name as the y-axis title.
                            title: {
                                display: true,
                                text: key
                            }

                        }

                    }

                }
            }
        );

    // Apply the current point visibility setting.
    applyPointVisibility(charts[key]);
}


// ========================================
// Remove graph
// ========================================

function removeGraph(key) {

    // If the requested graph does not exist, there is
    // nothing to remove.
    if (!charts[key]) {
        return;
    }


    // Destroy the Chart.js instance to free its resources.
    charts[key].destroy();

    // Remove the chart from the charts object.
    delete charts[key];


    // Search through the graph wrappers on the page.
    for (
        const graph of graphsContainer.children
    ) {

        // Find the title inside this graph wrapper.
        const title =
            graph.querySelector("h3");

        // Check whether this is the graph we want to remove.
        if (
            title &&
            title.textContent === key
        ) {

            // Remove the graph wrapper from the page.
            graph.remove();

            // Stop searching once the graph has been found.
            break;
        }
    }
}


// ========================================
// Update graphs
// ========================================

function updateGraphs() {

    // Get the names of all currently selected graph fields, capped at 20.
    const selectedFields =
        Array.from(
            graphOptions.querySelectorAll(
                "input[id^='graph-option-']:checked"
            )
        ).map(
            checkbox =>
                checkbox.value
        ).slice(0, 20);


    // ====================================
    // Create selected graphs
    // ====================================

    // Make sure every selected field has a graph.
    for (
        const key of selectedFields
    ) {

        createGraph(key);

    }


    // ====================================
    // Remove deselected graphs
    // ====================================

    // Check every graph that currently exists.
    for (
        const key of Object.keys(charts)
    ) {

        // If the graph is no longer selected,
        // remove it from the page.
        if (
            !selectedFields.includes(key)
        ) {

            removeGraph(key);

        }
    }


    // ====================================
    // Last minute only
    // ====================================

    // Get the current time in milliseconds.
    const now =
        Date.now();

    // Calculate the timestamp from one minute ago.
    const oneMinuteAgo =
        now - 60000;


    // Keep only records from the last minute.
    const recentRecords =
        records.filter(
            record => {

                // Ignore records without a timestamp.
                if (!record.timestamp) {
                    return false;
                }

                // Convert the record timestamp into milliseconds.
                const timestamp =
                    new Date(
                        record.timestamp
                    ).getTime();

                // Keep the record if its timestamp is valid
                // and it is within the last minute.
                return (
                    Number.isFinite(timestamp) &&
                    timestamp >= oneMinuteAgo
                );

            }
        );


    // ====================================
    // Update each graph
    // ====================================

    // Update every graph that is currently selected.
    for (
        const key of selectedFields
    ) {

        // Get the Chart.js object for this field.
        const chart =
            charts[key];

        // If the graph does not exist, skip it.
        if (!chart) {
            continue;
        }

        // Update the x-axis labels with the recent timestamps.
        chart.data.labels =
            recentRecords.map(
                record =>
                    formatTime(
                        record.timestamp
                    )
            );


        // Update the graph values with the recent data.
        chart.data.datasets[0].data =
            recentRecords.map(
                record =>
                    getNumericValue(
                        record[key]
                    )
            );


        // Update the graph without playing an animation.
        chart.update("none");

    }

}


// ========================================
// Show points toggle
// ========================================

pointsToggle.addEventListener("change", function () {

    // Store whether the checkbox is currently selected.
    const showPoints = this.checked;

    // Go through every graph currently displayed.
    Object.keys(charts).forEach(key => {

        // Get the existing Chart.js graph.
        const oldChart = charts[key];

        // If the graph no longer exists, skip it.
        if (!oldChart) {
            return;
        }

        // Save the current graph labels before destroying it.
        const labels = [...oldChart.data.labels];

        // Save the current graph values before destroying it.
        const data = [...oldChart.data.datasets[0].data];

        // Get the canvas used by the current graph.
        const canvas = oldChart.canvas;

        // Get the wrapper containing the canvas.
        const wrapper = canvas.parentElement;

        // Destroy the existing Chart.js instance.
        oldChart.destroy();

        // Recreate the chart using the same canvas.
        charts[key] = new Chart(
            canvas,
            {
                type: "line",

                data: {
                    // Restore the saved x-axis labels.
                    labels: labels,

                    datasets: [{
                        // Restore the graph field name.
                        label: key,

                        // Restore the graph data.
                        data: data,

                        // Restore the graph colour.
                        borderColor:
                            getGraphColor(key),

                        // Restore the background colour.
                        backgroundColor:
                            getGraphColor(key),

                        // Set the line thickness.
                        borderWidth: 2,

                        // Keep the line straight.
                        tension: 0,

                        // Show or hide points based on the checkbox.
                        pointRadius:
                            showPoints ? 2 : 0,

                        // Set the hover point size.
                        pointHoverRadius:
                            showPoints ? 4 : 0,

                        // Disable the additional hit area.
                        pointHitRadius: 0
                    }]
                },

                options: {
                    // Make the graph responsive.
                    responsive: true,

                    // Use the wrapper's height.
                    maintainAspectRatio: false,

                    // Disable normal graph animations.
                    animation: false,

                    // Disable animation when interacting with the graph.
                    transitions: {
                        active: {
                            animation: {
                                duration: 0
                            }
                        }
                    },

                    plugins: {
                        // Hide the built-in legend.
                        legend: {
                            display: false
                        }
                    },

                    elements: {
                        // Keep the graph line straight.
                        line: {
                            tension: 0
                        }
                    },

                    scales: {
                        // Configure the x-axis.
                        x: {
                            title: {
                                display: true,
                                text: "Time"
                            }
                        },

                        // Configure the y-axis.
                        y: {
                            title: {
                                display: true,
                                text: key
                            }
                        }
                    }
                }
            }
        );

    });

});


// ========================================
// Connect to Flask SSE stream
// ========================================

// Create an EventSource connection to the Flask endpoint.
const events =
    new EventSource(
        "/live?stream=1"
    );


// ========================================
// Receive live data
// ========================================

events.onmessage =
    function(event) {

        const data =
            JSON.parse(
                event.data
            );

        // Update status text or handle waiting message
        if (data.status) {
            vehicleData.textContent = data.status;
        } else {
            vehicleData.textContent = "";
        }

        // Loop through every key/value pair received.
        for (
            const [key, value]
            of Object.entries(data)
        ) {

            const numericValue = getNumericValue(value);
            const lowerKey = key.toLowerCase();

            if (
                key !== "id" &&
                lowerKey !== "on" &&
                lowerKey !== "off" &&
                lowerKey !== "status" &&
                numericValue !== null
            ) {
                addGraphOption(key);
            }

        }

        if (data.status) {
            return;
        }

        records.push(data);

        if (records.length > 5000) {
            records.shift();
        }

        updateGraphs();

    };


// ========================================
// SSE connection error
// ========================================

events.onerror =
    function() {
        console.log(
            "Live connection lost. Browser will retry..."
        );
        vehicleData.textContent = "Waiting for data to recommence...";
    };

</script>
