{% extends "base.html" %}

{% block title %}Database{% endblock %}

{% block content %}

<!-- Main heading displayed on the database page -->
<h1>Database Page</h1>

<style>

    /* ========================================
       GENERAL DATABASE LAYOUT
       ======================================== */

    .database-container {
        width: 100%;
        max-width: 100%;
    }

    .no-data {
        font-size: 18px;
        margin: 20px 0;
    }

    html[data-theme="dark"] .no-data {
        color: #ccc;
    }


    /* ========================================
       TABLE SELECTOR
       ======================================== */

    .table-selector {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 15px;
    }

    .table-selector label {
        font-size: 20px;
        transform: translateY(3px);
    }


    /* ========================================
       TABLE SELECTOR & LIMIT DROPDOWNS
       ======================================== */

    #tableSelect,
    #limitSelect {
        font-size: 14px;
        height: 25px;
        padding: 0 8px;
        box-sizing: border-box;
        border: 1px solid #767676;
        border-radius: 4px;
        background-color: #fff;
        color: #000;
        cursor: pointer;
    }


    /* ========================================
       PAGINATION & ACTION BUTTONS
       ======================================== */

    .page-nav-btn,
    #downloadButton {
        font-size: 14px;
        height: 25px;
        padding: 0 10px;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background: #ffffff;
        color: #000;
        border: 1px solid #767676;
        border-radius: 4px;
        white-space: nowrap;
    }

    #topPagination {
        display: inline-flex;
        gap: 10px;
    }

    .page-nav-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }


    /* ========================================
       BOTTOM PAGINATION CONTAINER
       ======================================== */

    .bottom-pagination {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 15px;
        font-size: 14px;
        color: #333;
    }

    html[data-theme="dark"] .bottom-pagination {
        color: #e0e0e0;
    }


    /* ========================================
       DELETE BUTTON
       ======================================== */

    #deleteButton {
        font-size: 14px;
        height: 25px;
        padding: 0 10px;
        box-sizing: border-box;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        background: #dc3545;
        color: #fff;
        border: 1px solid #b02a37;
        border-radius: 4px;
        white-space: nowrap;
    }


    /* ========================================
       LOADING MESSAGE
       ======================================== */

    #loading {
        display: none;
    }


    /* ========================================
       TABLE WRAPPER
       ======================================== */

    .table-wrapper {
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        padding-bottom: 30px;
    }


    /* ========================================
       DATABASE TABLE
       ======================================== */

    #dataTable {
        width: 100%;
        max-width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 14px;
    }

    #dataTable th,
    #dataTable td {
        padding: 6px 8px;
        border: 1px solid #ddd;
        text-align: left;
        overflow-wrap: anywhere;
        word-break: break-word;
        white-space: normal;
    }

    #dataTable th {
        background-color: #333;
        color: white;
    }

    #dataTable tr:nth-child(even) {
        background-color: #f5f5f5;
    }


    /* ========================================
       DARK MODE
       ======================================== */

    html[data-theme="dark"] #dataTable {
        color: #e0e0e0;
    }

    html[data-theme="dark"] #dataTable th,
    html[data-theme="dark"] #dataTable td {
        border-color: #555;
    }

    html[data-theme="dark"] #dataTable th {
        background-color: #333;
        color: #fff;
    }

    html[data-theme="dark"] #dataTable td {
        background-color: #555;
        color: #e0e0e0;
    }

    html[data-theme="dark"] #dataTable tr:nth-child(even) td {
        background-color: #606060;
    }


    /* ========================================
       DARK MODE CONTROLS
       ======================================== */

    html[data-theme="dark"] #tableSelect,
    html[data-theme="dark"] #limitSelect {
        background-color: #d3d3d3;
        color: #000;
        border: 1px solid #888;
        border-radius: 4px;
    }

    html[data-theme="dark"] #downloadButton,
    html[data-theme="dark"] .page-nav-btn {
        background-color: #d3d3d3;
        color: #000;
        border: 1px solid #888;
    }

    html[data-theme="dark"] #tableSelect option,
    html[data-theme="dark"] #limitSelect option {
        background-color: #d3d3d3;
        color: #000;
    }

</style>


<div class="database-container">

    {% if tables %}

    <div class="table-selector">

        <label for="tableSelect">Table:</label>

        <select id="tableSelect">
            {% for table in tables %}
                <option value="{{ table }}">
                    {{ table.replace("session_", "Session ") }}
                </option>
            {% endfor %}
        </select>

        <select id="limitSelect">
            <option value="50">Show 50</option>
            <option value="100">Show 100</option>
            <option value="250" selected>Show 250</option>
            <option value="all">Show all</option>
        </select>

        <!-- Top Page Left and Page Right buttons wrapper -->
        <span id="topPagination" style="display: none;">
            <button id="pageLeftBtn" class="page-nav-btn" type="button">&lt;</button>
            <button id="pageRightBtn" class="page-nav-btn" type="button">&gt;</button>
        </span>

        <button id="downloadButton" type="button">
            Download CSV
        </button>

        {% if current_user.admin %}
            <button id="deleteButton" type="button">
                Delete Session
            </button>
        {% endif %}

        <span id="loading">Loading...</span>

    </div>

    {% else %}

    <div class="no-data">
        No data stored.
    </div>

    {% endif %}

    <h2 id="tableTitle"></h2>

    <div class="table-wrapper">

        <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>

        <!-- Bottom Page Left, Page Indicator (Page n/total), and Page Right -->
        <div id="bottomPagination" class="bottom-pagination" style="display: none;">
            <button id="pageLeftBtnBottom" class="page-nav-btn" type="button">&lt;</button>
            <span id="pageIndicator">Page 1/1</span>
            <button id="pageRightBtnBottom" class="page-nav-btn" type="button">&gt;</button>
        </div>

    </div>

</div>


<script>

// ========================================
// GET HTML ELEMENTS
// ========================================

const tableSelect = document.getElementById("tableSelect");
const limitSelect = document.getElementById("limitSelect");

const topPagination = document.getElementById("topPagination");
const pageLeftBtn = document.getElementById("pageLeftBtn");
const pageRightBtn = document.getElementById("pageRightBtn");

const bottomPagination = document.getElementById("bottomPagination");
const pageLeftBtnBottom = document.getElementById("pageLeftBtnBottom");
const pageRightBtnBottom = document.getElementById("pageRightBtnBottom");
const pageIndicator = document.getElementById("pageIndicator");

const tableTitle = document.getElementById("tableTitle");
const tableHead = document.getElementById("tableHead");
const tableBody = document.getElementById("tableBody");
const loading = document.getElementById("loading");
const downloadButton = document.getElementById("downloadButton");

let currentOffset = 0;


// ========================================
// LOAD SELECTED TABLE
// ========================================

async function loadTable(tableName, limit, offset = 0) {

    loading.style.display = "inline";

    try {

        const response = await fetch(
            `/api/table?name=${encodeURIComponent(tableName)}&limit=${encodeURIComponent(limit)}&offset=${encodeURIComponent(offset)}`
        );

        if (!response.ok) {
            throw new Error("Failed to load table");
        }

        const data = await response.json();

        tableTitle.textContent = data.table.replace("session_", "Session ");
        tableHead.innerHTML = "";
        tableBody.innerHTML = "";

        // ========================================
        // UPDATE PAGINATION VISIBILITY & STATE
        // ========================================
        currentOffset = parseInt(data.offset ?? offset, 10);
        const limitVal = limitSelect.value;

        if (limitVal === "all") {
            topPagination.style.display = "none";
            bottomPagination.style.display = "none";
        } else {
            const limitNum = parseInt(limitVal, 10);
            const totalCount = data.total_count ?? 0;
            const totalPages = Math.max(1, Math.ceil(totalCount / limitNum));
            const currentPage = Math.floor(currentOffset / limitNum) + 1;

            if (totalPages <= 1) {
                topPagination.style.display = "none";
                bottomPagination.style.display = "none";
            } else {
                topPagination.style.display = "inline-flex";
                bottomPagination.style.display = "flex";

                // Format: Page n/total
                pageIndicator.textContent = `Page ${currentPage}/${totalPages}`;

                const isLeftDisabled = currentPage <= 1;
                const isRightDisabled = currentPage >= totalPages;

                pageLeftBtn.disabled = isLeftDisabled;
                pageRightBtn.disabled = isRightDisabled;
                pageLeftBtnBottom.disabled = isLeftDisabled;
                pageRightBtnBottom.disabled = isRightDisabled;
            }
        }


        // ========================================
        // CREATE TABLE HEADER
        // ========================================

        const headerRow = document.createElement("tr");

        data.columns.forEach(column => {
            const th = document.createElement("th");
            th.textContent = column;
            headerRow.appendChild(th);
        });

        tableHead.appendChild(headerRow);


        // ========================================
        // CREATE TABLE ROWS
        // ========================================

        data.rows.forEach(row => {
            const tr = document.createElement("tr");

            row.forEach(value => {
                const td = document.createElement("td");
                td.textContent = value ?? "";
                tr.appendChild(td);
            });

            tableBody.appendChild(tr);
        });

    } catch (error) {
        console.error(error);
        tableTitle.textContent = "Error loading table";
    } finally {
        loading.style.display = "none";
    }
}


// ========================================
// REFRESH AVAILABLE TABLES
// ========================================

async function refreshTables() {
    try {
        const response = await fetch("/api/tables");
        if (!response.ok) return;

        const data = await response.json();
        const currentSelection = tableSelect.value;
        const newTables = data.tables;

        const existingTables = Array.from(tableSelect.options).map(option => option.value);

        if (JSON.stringify(newTables) !== JSON.stringify(existingTables)) {
            tableSelect.innerHTML = "";

            newTables.forEach(table => {
                const option = document.createElement("option");
                option.value = table;
                option.textContent = table.replace("session_", "Session ");
                tableSelect.appendChild(option);
            });

            if (newTables.includes(currentSelection)) {
                tableSelect.value = currentSelection;
            } else if (newTables.length > 0) {
                tableSelect.value = newTables[0];
                currentOffset = 0;
                loadTable(newTables[0], limitSelect.value, currentOffset);
            } else {
                tableTitle.textContent = "";
                tableHead.innerHTML = "";
                tableBody.innerHTML = "";
                topPagination.style.display = "none";
                bottomPagination.style.display = "none";
            }
        }
    } catch (error) {
        console.error("Failed to refresh tables:", error);
    }
}

setInterval(refreshTables, 30000);


// ========================================
// DOWNLOAD TABLE AS CSV
// ========================================

downloadButton.addEventListener("click", function () {
    const tableName = tableSelect.value;
    if (!tableName) return;
    window.location.href = `/api/table/csv?name=${encodeURIComponent(tableName)}`;
});


// ========================================
// DELETE SESSION
// ========================================

const deleteButton = document.getElementById("deleteButton");

if (deleteButton) {
    deleteButton.addEventListener("click", async function () {
        const tableName = tableSelect.value;
        if (!tableName) return;

        const sessionNumber = tableName.replace("session_", "");
        const confirmed = confirm(`Are you sure you wish to delete session ${sessionNumber}?`);
        if (!confirmed) return;

        try {
            const response = await fetch(
                `/api/table/delete?name=${encodeURIComponent(tableName)}`,
                { method: "DELETE" }
            );

            if (!response.ok) throw new Error("Failed to delete session");
            window.location.reload();
        } catch (error) {
            console.error(error);
            alert("Failed to delete session.");
        }
    });
}


// ========================================
// SWITCH DATABASE TABLE, LIMIT OR PAGE
// ========================================

tableSelect.addEventListener("change", function () {
    currentOffset = 0;
    loadTable(this.value, limitSelect.value, currentOffset);
});

limitSelect.addEventListener("change", function () {
    if (tableSelect.value) {
        currentOffset = 0;
        loadTable(tableSelect.value, this.value, currentOffset);
    }
});

function goToPreviousPage() {
    if (tableSelect.value && limitSelect.value !== "all") {
        const limitNum = parseInt(limitSelect.value, 10);
        currentOffset = Math.max(0, currentOffset - limitNum);
        loadTable(tableSelect.value, limitSelect.value, currentOffset);
    }
}

function goToNextPage() {
    if (tableSelect.value && limitSelect.value !== "all") {
        const limitNum = parseInt(limitSelect.value, 10);
        currentOffset += limitNum;
        loadTable(tableSelect.value, limitSelect.value, currentOffset);
    }
}

pageLeftBtn.addEventListener("click", goToPreviousPage);
pageLeftBtnBottom.addEventListener("click", goToPreviousPage);

pageRightBtn.addEventListener("click", goToNextPage);
pageRightBtnBottom.addEventListener("click", goToNextPage);


// ========================================
// INITIAL TABLE LOAD
// ========================================

if (tableSelect.value) {
    currentOffset = 0;
    loadTable(tableSelect.value, limitSelect.value, currentOffset);
}

</script>

{% endblock %}
