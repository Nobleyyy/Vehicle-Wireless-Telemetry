{% extends "base.html" %}

{% block title %}Database{% endblock %}

{% block content %}

<style>
    .database-container {
        width: 100%;
        max-width: 100%;
    }

    .no-data {
        font-size: 18px;
        margin: 20px 0;
    }

    html[data-theme="dark"] .no-data {
        color: #ccc;
    }


    .table-selector {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 15px;
    }

    .table-selector label {
        font-size: 20px;
        transform: translateY(3px);
    }

    #downloadButton {
        font-size: 15px;
        padding: 2px 8px;
        height: 25px;
        cursor: pointer;
        background: #ffffff;
        color: #000;
        border: 1px solid #767676;
        border-radius: 2px;
    }

    #deleteButton {
        font-size: 15px;
        padding: 2px 8px;
        height: 25px;
        cursor: pointer;
        background: #dc3545;
        color: #fff;
        border: 1px solid #b02a37;
        border-radius: 2px;
    }

    #loading {
        display: none;
    }

    .table-wrapper {
        width: 100%;
        max-width: 100%;
        overflow: hidden;
        padding-bottom: 30px;
    }

    #dataTable {
        width: 100%;
        max-width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
        font-size: 14px;
    }

    #dataTable th,
    #dataTable td {
        padding: 6px 8px;
        border: 1px solid #ddd;
        text-align: left;
        overflow-wrap: anywhere;
        word-break: break-word;
        white-space: normal;
    }

    #dataTable th {
        background-color: #333;
        color: white;
    }

    #dataTable tr:nth-child(even) {
        background-color: #f5f5f5;
    }


    /* ========================================
       DARK MODE
       ======================================== */

    html[data-theme="dark"] #dataTable {
        color: #e0e0e0;
    }

    html[data-theme="dark"] #dataTable th,
    html[data-theme="dark"] #dataTable td {
        border-color: #555;
    }

    html[data-theme="dark"] #dataTable th {
        background-color: #333;
        color: #fff;
    }

    html[data-theme="dark"] #dataTable td {
        background-color: #555;
        color: #e0e0e0;
    }

    html[data-theme="dark"] #dataTable tr:nth-child(even) td {
        background-color: #606060;
    }

    /* Dark mode controls */
    html[data-theme="dark"] #tableSelect {
        background-color: #d3d3d3;
        color: #000;
        border: 1px solid #888;
    }

    html[data-theme="dark"] #downloadButton {
        background-color: #d3d3d3;
        color: #000;
        border: 1px solid #888;
    }

    html[data-theme="dark"] #tableSelect option {
        background-color: #d3d3d3;
        color: #000;
    }

</style>


<div class="database-container">

    {% if tables %}
    <div class="table-selector">

        <label for="tableSelect">Table:</label>

        <select id="tableSelect">
            {% for table in tables %}
                <option value="{{ table }}">
                    {{ table.replace("session_", "Session ") }}
                </option>
            {% endfor %}
        </select>

        <button id="downloadButton" type="button">
            Download CSV
        </button>

        {% if current_user.admin %}
            <button id="deleteButton" type="button">
                Delete Session
            </button>
        {% endif %}

        <span id="loading">Loading...</span>

    </div>
    {% else %}
    <div class="no-data">
        No data stored.
    </div>
    {% endif %}


    <h2 id="tableTitle"></h2>


    <div class="table-wrapper">

        <table id="dataTable">

            <thead id="tableHead"></thead>

            <tbody id="tableBody"></tbody>

        </table>

    </div>

</div>


<script>

const tableSelect = document.getElementById("tableSelect");
const tableTitle = document.getElementById("tableTitle");
const tableHead = document.getElementById("tableHead");
const tableBody = document.getElementById("tableBody");
const loading = document.getElementById("loading");
const downloadButton = document.getElementById("downloadButton");


async function loadTable(tableName) {

    loading.style.display = "inline";

    try {

        const response = await fetch(
            `/api/table?name=${encodeURIComponent(tableName)}`
        );

        if (!response.ok) {
            throw new Error("Failed to load table");
        }

        const data = await response.json();

        tableTitle.textContent = data.table.replace(
            "session_",
            "Session "
        );

        tableHead.innerHTML = "";
        tableBody.innerHTML = "";


        // Create table header
        const headerRow = document.createElement("tr");

        data.columns.forEach(column => {

            const th = document.createElement("th");

            th.textContent = column;

            headerRow.appendChild(th);

        });

        tableHead.appendChild(headerRow);


        // Create table rows
        data.rows.forEach(row => {

            const tr = document.createElement("tr");

            row.forEach(value => {

                const td = document.createElement("td");

                td.textContent = value ?? "";

                tr.appendChild(td);

            });

            tableBody.appendChild(tr);

        });

    } catch (error) {

        console.error(error);

        tableTitle.textContent = "Error loading table";

    } finally {

        loading.style.display = "none";
    }
}


async function refreshTables() {

    try {

        const response = await fetch("/api/tables");

        if (!response.ok) {
            return;
        }

        const data = await response.json();

        const currentSelection = tableSelect.value;
        const newTables = data.tables;

        const existingTables = Array.from(tableSelect.options)
            .map(option => option.value);

        // Only update if the list has changed
        if (JSON.stringify(newTables) !== JSON.stringify(existingTables)) {

            tableSelect.innerHTML = "";

            newTables.forEach(table => {

                const option = document.createElement("option");

                option.value = table;
                option.textContent = table.replace(
                    "session_",
                    "Session "
                );

                tableSelect.appendChild(option);

            });

            // Keep the current session if it still exists
            if (newTables.includes(currentSelection)) {

                tableSelect.value = currentSelection;

            // Current session was deleted
            } else if (newTables.length > 0) {

                tableSelect.value = newTables[0];

                loadTable(newTables[0]);

            } else {

                tableTitle.textContent = "";
                tableHead.innerHTML = "";
                tableBody.innerHTML = "";

            }

        }

    } catch (error) {

        console.error("Failed to refresh tables:", error);

    }

}

// Check for database changes every 5 seconds
setInterval(refreshTables, 30000);

// Download currently selected table as CSV
downloadButton.addEventListener("click", function () {

    const tableName = tableSelect.value;

    if (!tableName) {
        return;
    }

    window.location.href =
        `/api/table/csv?name=${encodeURIComponent(tableName)}`;

});

const deleteButton = document.getElementById("deleteButton");

if (deleteButton) {

    deleteButton.addEventListener("click", async function () {

        const tableName = tableSelect.value;

        if (!tableName) {
            return;
        }

        const sessionNumber = tableName.replace("session_", "");

        const confirmed = confirm(
            `Are you sure you wish to delete session ${sessionNumber}?`
        );

        if (!confirmed) {
            return;
        }

        try {

            const response = await fetch(
                `/api/table/delete?name=${encodeURIComponent(tableName)}`,
                {
                    method: "DELETE"
                }
            );

            if (!response.ok) {
                throw new Error("Failed to delete session");
            }

            // Reload the page after successful deletion
            window.location.reload();

        } catch (error) {

            console.error(error);

            alert("Failed to delete session.");

        }

    });

}


// Switch table without reloading the page
tableSelect.addEventListener("change", function () {

    loadTable(this.value);

});


// Load the first table
if (tableSelect.value) {

    loadTable(tableSelect.value);

}

</script>

{% endblock %}
